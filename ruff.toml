# Lint policy for the Python packs — consumed by the "Lint Python" step in
# .github/workflows/validate.yml and by scripts/verify-all.sh (`ruff check python/`).
#
# Deliberately pinned to Ruff's classic correctness set — pycodestyle errors
# (E4/E7/E9) plus Pyflakes (F). Ruff keeps promoting new opt-in rules into its
# defaults from release to release, so without an explicit policy this gate
# would eventually turn red on an otherwise untouched tree.
target-version = "py312"
select = ["E4", "E7", "E9", "F"]
